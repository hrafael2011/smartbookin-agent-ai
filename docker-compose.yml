

services:
  api-backend:
    build: ./backend/api-backend
    entrypoint: ["/app/entrypoint.sh"]
    volumes:
      - ./backend/api-backend:/app
    # Puerto en el host (si 8000 está ocupado: API_BACKEND_HOST_PORT=18008 en `.env`)
    ports:
      - "${API_BACKEND_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    # Sin recrear el contenedor, nuevas claves en .env no se aplican; además default para pruebas
    environment:
      DISABLE_USAGE_LIMITS: ${DISABLE_USAGE_LIMITS:-true}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: smartbooking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartbooking"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Túnel HTTPS directo hacia el API (MVP fase 2: el frontend vive en Vercel,
  # nginx/frontend-build se eliminaron). Requiere token en .env: AUTO_TOKEN_NGROK
  # Uso: docker compose --profile ngrok up -d
  # Luego: ./scripts/telegram-webhook-sync.sh
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["ngrok"]
    depends_on:
      api-backend:
        condition: service_started
    environment:
      NGROK_AUTHTOKEN: ${AUTO_TOKEN_NGROK:-}
    command: ["http", "--log=stdout", "http://api-backend:8000"]
    ports:
      - "4040:4040"
    restart: unless-stopped

volumes:
  postgres_data:
